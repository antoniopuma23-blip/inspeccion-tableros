# =============================================================================
#  Robot móvil de inspección térmica de tableros eléctricos
#  Archivo de configuración principal
# -----------------------------------------------------------------------------
#  - Los pines usan numeración BCM (GPIOxx), no el número físico del conector.
#  - Los cambios hechos desde la página "Configuración" de la interfaz web se
#    guardan en data/config_usuario.yaml y se aplican ENCIMA de este archivo,
#    por lo que este archivo (con sus comentarios) nunca se sobrescribe.
#  - Para volver a los valores de fábrica basta con borrar
#    data/config_usuario.yaml.
# =============================================================================

robot:
  nombre: "Robot de Inspección Térmica RIT-01"

servidor:
  host: "0.0.0.0"          # Escucha en todas las interfaces (Wi-Fi y Ethernet)
  puerto: 5000             # http://robot.local:5000

datos:
  directorio: "data"       # Base de datos SQLite, capturas y reportes PDF

# -----------------------------------------------------------------------------
#  Pines (BCM)
# -----------------------------------------------------------------------------
pines:
  motor_izquierdo:
    pwm: 18                # ENA  -> PWM por hardware (canal PWM0)
    in1: 23                # IN1  -> dirección
    in2: 24                # IN2  -> dirección
  motor_derecho:
    pwm: 13                # ENB  -> PWM por hardware (canal PWM1)
    in1: 27                # IN3  -> dirección
    in2: 22                # IN4  -> dirección
  encoder_izquierdo:
    a: 17
    b: 16
  encoder_derecho:
    a: 5
    b: 6
  i2c:                     # Bus I2C-1 (fijo en hardware, solo informativo)
    sda: 2
    scl: 3
  uart_esp32:              # UART0 (/dev/serial0), solo si el ESP32 se habilita
    tx: 14
    rx: 15
  # --- Sensores reutilizados del proyecto TechRoach ---------------------------
  dht22:
    datos: 4               # DHT22 (temperatura y humedad), pull-up 10 kΩ a 3.3 V
  pir:
    salida: 25             # PIR HC-SR501 (salida de 3.3 V)
  vibracion:
    salida: 20             # Módulo piezoeléctrico / vibración (salida digital DO)
  iluminacion:
    mosfet: 26             # LED de iluminación propia (MOSFET), lo controla el LDR
  alarma:
    buzzer: 21             # Zumbador activo (vía transistor) -> alerta acústica
    led: 19                # LED rojo -> alerta visual
  # Respaldo SIN ADS1115: salidas digitales DO de los módulos (comparador del
  # propio módulo). ¡Si el módulo se alimenta a 5 V, usar divisor a 3.3 V!
  mq2_digital:
    salida: 7
  mq7_digital:
    salida: 8

# -----------------------------------------------------------------------------
#  Motores DC + driver L298N
# -----------------------------------------------------------------------------
motores:
  pwm_frecuencia_hz: 2000  # El L298N conmuta lento; 1-5 kHz es un buen rango
  rpm_nominales: 330       # rpm del eje de salida a voltaje nominal
  duty_minimo: 0.22        # Zona muerta: por debajo de este duty el motor no gira
  invertir_izquierdo: false
  invertir_derecho: false

# -----------------------------------------------------------------------------
#  Tracción por orugas (skid steering)
# -----------------------------------------------------------------------------
traccion:
  # Diámetro de la rueda motriz (sprocket) que mueve la oruga, en metros.
  # Es VARIABLE: si no se conoce, calibrar con
  #     python scripts/pruebas/calibrar_diametro.py
  # o ajustarlo desde la página "Configuración".
  diametro_rueda_m: 0.040
  separacion_orugas_m: 0.18      # Distancia entre los centros de las orugas
  velocidad_maxima_m_s: 0.30     # Límite de velocidad (ISO 3691-4: 0.3 m/s)
  aceleracion_m_s2: 0.40         # Rampa de aceleración/desaceleración suave
  velocidad_giro_factor: 0.6     # Fracción de la velocidad máx. usada al girar
  lazo_cerrado: true             # Control PI de velocidad con los encoders
  kp: 0.6
  ki: 2.5

encoders:
  pulsos_por_vuelta_motor: 11    # Pulsos por canal en el eje del motor
  relacion_reduccion: 30         # Caja reductora (330 rpm típicamente 1:30)
  # 4 = cuadratura completa (canales A y B, máxima resolución)
  # 1 = solo flancos de subida de A (menos carga de CPU; el sentido se toma
  #     del comando aplicado al motor)
  modo_cuadratura: 4
  filtro_glitch_us: 20           # Filtro anti-rebote de pigpio
  invertir_izquierdo: false      # Invierte el signo si el conteo sale al revés
  invertir_derecho: false

# -----------------------------------------------------------------------------
#  Seguridad
# -----------------------------------------------------------------------------
seguridad:
  watchdog_ms: 500               # Sin comando de movimiento en 500 ms -> paro
  periodo_control_ms: 20         # Lazo de control a 50 Hz

# -----------------------------------------------------------------------------
#  Cámara térmica MLX90640 (32x24, FOV 55°x35°)
# -----------------------------------------------------------------------------
camara_termica:
  habilitada: true
  frecuencia_hz: 4               # Cuadros completos por segundo deseados
  i2c_frecuencia_hz: 400000      # Requiere dtparam=i2c_arm_baudrate=400000
  emisividad: 0.95               # Superficies pintadas/oxidadas ~0.95
  temp_reflejada_c: 25.0         # Temperatura aparente reflejada (ambiente)
  # Si hay lectura válida del DHT22 se usa como temperatura reflejada
  # (aproximación: temperatura ambiente ≈ temperatura reflejada)
  usar_dht22_como_reflejada: true
  rotar_180: false              # Si el sensor está montado de cabeza
  espejo_horizontal: false

# -----------------------------------------------------------------------------
#  Cámara visible: webcam USB (OpenCV). Reemplaza a la ESP32-CAM de TechRoach.
#  También se soporta un módulo Pi Camera (tipo: picamera2 o auto).
# -----------------------------------------------------------------------------
camara_visible:
  tipo: "usb"                    # usb | auto | picamera2
  indice_usb: -1                 # -1 = buscar la primera webcam (/dev/video0..3)
  ancho: 640
  alto: 480
  fps: 12
  calidad_jpeg: 70

# Alineación del térmico sobre el visible (fracción del cuadro visible que
# cubre el térmico) = FOV térmico / FOV webcam. Webcam típica de 60°x45°:
# 55/60 ≈ 0.92 y 35/45 ≈ 0.78. Ajustar según la webcam (valores > 1 si la
# webcam tiene un FOV más angosto que el MLX90640).
superposicion:
  escala_x: 0.92
  escala_y: 0.78
  desplazamiento_x: 0.0          # Fracción del ancho (-0.5 a 0.5)
  desplazamiento_y: 0.0          # Fracción del alto  (-0.5 a 0.5)

# -----------------------------------------------------------------------------
#  Análisis térmico (criterio ΔT de ANSI/NETA MTS, componentes similares)
# -----------------------------------------------------------------------------
analisis:
  umbral_posible_c: 1.0          # ΔT >= 1 °C          -> Posible deficiencia
  umbral_reparar_c: 4.0          # ΔT >= 4 °C          -> Reparar en próxima oportunidad
  umbral_inmediata_c: 15.0       # ΔT >  15 °C         -> Reparación inmediata
  referencia_por_defecto: "mediana"   # mediana | punto | manual

interfaz:
  paleta: "ironbow"              # ironbow | arcoiris | grises | lava

# -----------------------------------------------------------------------------
#  Batería LiPo 2S (7.4 V). Se lee con el canal A3 del ADS1115 (divisor
#  10 kΩ / 4.7 kΩ) o, si el ESP32 está habilitado, desde el ESP32.
# -----------------------------------------------------------------------------
bateria:
  celdas: 2

# =============================================================================
#  SENSORES AMBIENTALES (reutilizados del proyecto TechRoach)
# =============================================================================
#  La Raspberry Pi NO tiene entradas analógicas: los sensores analógicos
#  (MQ-2, MQ-7, LDR y batería) se leen con un ADS1115 (ADC de 16 bits por
#  I2C, dirección 0x48) en el mismo bus que el MLX90640.
# -----------------------------------------------------------------------------
sensores:
  habilitados: true
  periodo_s: 0.5                 # Lectura de ADC y entradas digitales (2 Hz)

  ads1115:
    habilitado: true
    direccion: 0x48
    bus_i2c: 1
    canales:                     # A0..A3
      mq2: 0
      mq7: 1
      ldr: 2
      bateria: 3
    # Las salidas AO de los módulos MQ (0-5 V) pasan por un divisor
    # 10 kΩ / 20 kΩ antes del ADS1115 (alimentado a 3.3 V): V_sensor = V_adc × 1.5
    divisor_mq: 1.5
    divisor_bateria: 3.128       # (10 kΩ + 4.7 kΩ) / 4.7 kΩ

  dht22:
    habilitado: true
    periodo_s: 3.0               # El DHT22 admite como máximo 1 lectura cada 2 s

  mq2:                           # Gases inflamables (curva de GLP de la hoja de datos)
    rl_kohm: 1.0                 # Resistencia de carga del módulo (1 kΩ o 10 kΩ)
    vc: 5.0                      # Voltaje de alimentación del sensor
    r0_kohm: 10.0                # Resistencia en aire limpio: CALIBRAR
    razon_aire_limpio: 9.83      # Rs/R0 en aire limpio (hoja de datos)
    curva_a: 574.25              # ppm = a · (Rs/R0)^b
    curva_b: -2.222
    advertencia_ppm: 500
    alarma_ppm: 1000             # ~5 % del LIE del GLP

  mq7:                           # Monóxido de carbono
    rl_kohm: 1.0
    vc: 5.0
    r0_kohm: 10.0                # CALIBRAR en aire limpio
    razon_aire_limpio: 27.5
    curva_a: 99.042
    curva_b: -1.518
    advertencia_ppm: 35          # Valor de referencia de exposición a CO
    alarma_ppm: 100

  ldr:
    invertir: false              # true si el voltaje BAJA con más luz
    umbral_oscuridad_pct: 25     # Debajo de este % de luz se enciende el LED
    histeresis_pct: 8

  # Anti falsas alarmas (principal desafío de TechRoach)
  calentamiento_s: 180           # Los MQ no generan alarmas al arrancar
  muestras_filtro: 5             # Filtro de mediana
  confirmaciones: 3              # Lecturas seguidas sobre el umbral para alarmar
  histeresis_pct: 10             # La alarma se libera 10 % por debajo del umbral

# -----------------------------------------------------------------------------
#  RESPUESTAS AUTOMÁTICAS (mismas reglas de TechRoach)
# -----------------------------------------------------------------------------
respuestas:
  humedad_alta_pct: 80           # HR > 80 % -> reducir velocidad
  factor_humedad: 0.5
  # Gas MQ-2 o CO MQ-7 en alarma -> alerta visual/acústica + detención.
  # Mientras dure la alarma solo se permite RETROCEDER para salir de la zona.
  permitir_retroceso_en_gas: true
  # PIR: presencia de personas -> velocidad reducida durante un tiempo.
  # (El PIR solo es confiable con el robot detenido: se evalúa en reposo.)
  factor_presencia: 0.4
  duracion_presencia_s: 10
  # Piezoeléctrico: impacto o caída -> detención y registro del evento
  detener_por_impacto: true
  buzzer: true

# -----------------------------------------------------------------------------
#  CONTROL XBOX (temporal; a futuro, control dedicado para el proyecto)
# -----------------------------------------------------------------------------
#  Funciona de dos formas (se pueden usar ambas):
#   1) En el navegador (Gamepad API): el control se conecta a la PC/celular
#      que muestra la interfaz. No requiere configuración.
#   2) Directo en la Raspberry Pi (USB o Bluetooth), leído con evdev.
control_xbox:
  habilitado_pi: true            # Buscar un control conectado a la Pi
  modo: "arcade"                 # arcade (stick izq.) | tanque (un stick por oruga)
  zona_muerta: 0.15
  expo: 0.35                     # Curva de respuesta: más fino cerca del centro

# -----------------------------------------------------------------------------
#  ESP32-S3 opcional por UART (JSON por línea). DESACTIVADO por defecto:
#  el robot funciona completo sin él.
# -----------------------------------------------------------------------------
esp32:
  habilitado: false
  puerto: "/dev/serial0"
  baudios: 115200

# -----------------------------------------------------------------------------
#  Reporte PDF
# -----------------------------------------------------------------------------
reporte:
  empresa: "Laboratorio de Mecatrónica"
  titulo: "Reporte de Inspección Termográfica"
  responsable: "Inspector"
  logo: ""                       # Ruta a un PNG/JPG; vacío = logo por defecto

# -----------------------------------------------------------------------------
#  Modo simulación (se activa con la variable de entorno ROBOT_SIM=1)
# -----------------------------------------------------------------------------
simulacion:
  bateria_simulada: true         # Muestra una batería simulada para la demo
